steps:
  # 1. Build Backend API Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/api:latest'
      - '-f'
      - 'ops/docker/Dockerfile.api'
      - '.'
    id: 'build-api'

  # 2. Build Next.js Frontend Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/frontend:latest'
      - '-f'
      - 'ops/docker/Dockerfile.frontend'
      - '.'
    id: 'build-frontend'

  # 3. Push API & Frontend Images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/api:latest']
    id: 'push-api'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/frontend:latest']
    id: 'push-frontend'

  # 4. Deploy FastAPI Control Plane to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'oncogemma-api'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/api:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=$PROJECT_ID:$_REGION:oncogemma-dev-psql'
      - '--cpu=4'
      - '--memory=8Gi'
      - '--no-cpu-throttling'
      - '--min-instances=1'
      - '--update-env-vars=VERTEX_MITOSIS_ENDPOINT_ID=6276949705008087040,VERTEX_MITOSIS_LOCATION=us-central1,USE_GEMINI_FLASH_REFEREE=true,GEMINI_REFEREE_MODEL=gemini-2.5-flash,VERTEX_MEDGEMMA_ENDPOINT_ID=2026818294165536768,VERTEX_MEDGEMMA_LOCATION=us-central1,VERTEX_PATH_FOUNDATION_ENDPOINT_ID=6638504312592924672,VERTEX_PATH_FOUNDATION_LOCATION=us-central1'
    id: 'deploy-api'


  # 5. Deploy Next.js Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'oncogemma-frontend'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/oncogemma-repo/frontend:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--cpu=1'
      - '--memory=1Gi'
      - '--cpu-throttling'
      - '--min-instances=0'
    id: 'deploy-frontend'

substitutions:
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
