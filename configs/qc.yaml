# OncoGemma Automated Slide Quality Control (QC) Configuration
# PRD 02-stage-v4.1-preprocess-qc §3.1 Automated Pre-Flight Checks

tissue_coverage:
  fail_threshold: 0.02  # < 2% tissue coverage triggers hard fail
  warn_threshold: 0.05  # < 5% tissue coverage triggers warning

focus:
  vol_threshold: 45.0   # Variance of Laplacian (VoL) threshold below which a 512x512 tile is considered blurry (PRD §3.1)
  tile_size_px: 512
  sample_max_tiles: 400
  fail_blurry_ratio: 0.30  # > 30% blurry tissue tiles triggers hard fail (PRD §3.1)
  warn_blurry_ratio: 0.10  # > 10% blurry tissue tiles triggers warning (PRD §3.1)

pen_marks:
  min_component_area_mm2: 1.0  # Connected components > 1.0 mm² trigger warning
  hsv_ranges:
    green:
      h_min: 35
      h_max: 85
      s_min: 60
      v_min: 60
    blue:
      h_min: 90
      h_max: 130
      s_min: 60
      v_min: 60
    black:
      h_min: 0
      h_max: 180
      s_min: 0
      s_max: 50
      v_min: 0
      v_max: 50

folds:
  min_skeleton_length_mm: 2.0  # Morphological skeleton > 2.0 mm triggers warning
  saturation_min: 160          # High saturation ridge
  brightness_max: 100          # Low brightness ridge

stain_sanity:
  min_concentration: 0.15      # Faded stain threshold
  he_ratio_min: 0.1            # H:E concentration ratio lower bound
  he_ratio_max: 5.0            # H:E concentration ratio upper bound
